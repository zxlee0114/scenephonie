name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR 合併必要條件：把這個 job 設為 GitHub branch protection 的 required status check
# （見 docs/tech-stack.md「CI 與合併閘門」）。
jobs:
  verify:
    runs-on: ubuntu-latest

    # persistence 的並行、遷移與備份行為只有在真的 Postgres 上才成立（票券 05），
    # 所以測試不用替身 —— CI 起一顆真的資料庫。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scenephonie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # CI 的 Postgres 是直連，沒有 pooler —— 兩條指向同一顆。
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scenephonie
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/scenephonie
    steps:
      - uses: actions/checkout@v7

      # pnpm 版本由 package.json 的 "packageManager" 決定，這裡不再指定 version
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (含 §5.5 isomorphic 邊界)
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Migrate（persistence 整合測試要真的表）
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
