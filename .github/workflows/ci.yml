name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR 合併必要條件：把這個 job 設為 GitHub branch protection 的 required status check
# （見 docs/tech-stack.md「CI 與合併閘門」）。
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      # pnpm 版本由 package.json 的 "packageManager" 決定，這裡不再指定 version
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (含 §5.5 isomorphic 邊界)
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
